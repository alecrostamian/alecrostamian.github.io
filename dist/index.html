<div class="project"><span class="project-number">03</span><div>
<h3>NBA Shot Make Predictor</h3>
<p>Built an end-to-end NBA shot make-probability model using enterprise-level data provided via the Oklahoma City Thunder.</p>
<p>Engineered 58 shot-geometry, defensive-pressure, and player-profile features across 425K+ shots.</p>
<p>Developed and validated CatBoost, logistic regression, GAM, and LightGBM models, ultimately achieving 0.620 season-holdout log loss with a 5-seed LightGBM ensemble, a 10% improvement over the naive baseline.</p>
<span class="status">Python (LightGBM, CatBoost, polars, pandas, NumPy, scikit-learn) · Sep. 2026</span>
